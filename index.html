<style>
:root {
  --bg: #0d0503;
  --bg-elevated: #180905;
  --brown: #261009;
  --gold: #e7bd82;
  --gold-bright: #f6dca8;
  --gold2: #b77b45;
  --cream: #fff1df;
  --muted: #bfa78e;
  --glass-bg: linear-gradient(145deg, rgba(255, 236, 210, 0.085), rgba(255, 200, 145, 0.018));
  --glass-border: rgba(231, 189, 130, 0.22);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--gold);
  color: #160905;
}

/* AMBIENT BACKDROP */
.background {
  position: fixed;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(circle at 74% 24%, rgba(138, 61, 27, 0.34), transparent 42%),
    radial-gradient(circle at 18% 78%, rgba(92, 36, 18, 0.28), transparent 46%),
    radial-gradient(circle at 50% 50%, rgba(42, 16, 8, 0.55), transparent 75%),
    var(--bg);
}

.ambient-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: -2;
  opacity: 0.45;
}

.orb-1 {
  width: 520px;
  height: 520px;
  top: -120px;
  right: -80px;
  background: rgba(183, 123, 69, 0.22);
}

.orb-2 {
  width: 460px;
  height: 460px;
  bottom: -140px;
  left: -100px;
  background: rgba(112, 42, 18, 0.26);
}

.noise {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  opacity: 0.032;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
}

/* SCROLL PROGRESS */
.progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2.5px;
  width: 0;
  z-index: 120;
  background: linear-gradient(90deg, var(--gold2), var(--gold-bright));
  box-shadow: 0 0 12px rgba(231, 189, 130, 0.65);
  transition: width 0.08s linear;
}

/* LOADER */
.loader {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: #0d0503;
  transition: opacity 0.75s var(--ease-out), visibility 0.75s var(--ease-out);
}

.loader.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-inner {
  text-align: center;
}

.loader img {
  width: 185px;
  height: 115px;
  object-fit: contain;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.7));
}

.loader p {
  color: var(--gold);
  text-align: center;
  letter-spacing: 5px;
  font-size: 10px;
  font-weight: 600;
  margin-top: 14px;
}

.loader-line {
  width: 185px;
  height: 2px;
  background: rgba(255, 255, 255, 0.12);
  margin: 22px auto 0;
  border-radius: 99px;
  overflow: hidden;
}

.loader-line::after {
  content: "";
  display: block;
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, var(--gold2), var(--gold-bright));
  animation: loadSlide 1.05s var(--ease-out) infinite;
}

@keyframes loadSlide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(320%); }
}

/* NAVIGATION */
nav {
  position: fixed;
  z-index: 60;
  top: 0;
  left: 0;
  width: 100%;
  height: 84px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 241, 223, 0.09);
  background: rgba(13, 5, 3, 0.65);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  transition: height 0.35s var(--ease-out), background 0.35s var(--ease-out), border-color 0.35s var(--ease-out);
}

nav.scrolled {
  height: 68px;
  background: rgba(13, 5, 3, 0.9);
  border-bottom-color: rgba(231, 189, 130, 0.18);
}

.logo {
  width: 148px;
  height: 64px;
  object-fit: contain;
  display: block;
  transition: transform 0.3s var(--ease-out);
}

.logo:hover {
  transform: scale(1.03);
}

.links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.links a {
  font-size: 10.5px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: #ebd9c3;
  font-weight: 500;
  transition: color 0.25s ease, transform 0.25s ease;
}

.links a:hover {
  color: var(--gold);
}

.nav-button {
  padding: 11px 20px;
  border: 1px solid rgba(231, 189, 130, 0.45);
  border-radius: 999px;
  background: rgba(231, 189, 130, 0.08);
  color: var(--gold) !important;
  font-weight: 600;
  transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
}

.nav-button:hover {
  background: rgba(231, 189, 130, 0.18);
  border-color: var(--gold);
  transform: translateY(-1px);
}

.menu {
  display: none;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  width: 44px;
  height: 44px;
  color: var(--cream);
  font-size: 20px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

/* HERO */
.hero {
  min-height: 100svh;
  padding: 124px 7% 70px;
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  align-items: center;
  gap: 28px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 4.5px;
  color: var(--gold);
  font-weight: 700;
  text-transform: uppercase;
}

.hero h1 {
  font: 600 clamp(62px, 7.2vw, 110px) / 0.96 'Playfair Display', serif;
  letter-spacing: -3.5px;
  margin: 26px 0;
}

.hero h1 em {
  font-style: italic;
  color: var(--gold);
  font-weight: 500;
}

.description {
  max-width: 430px;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.9;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 34px;
}

.btn {
  display: inline
